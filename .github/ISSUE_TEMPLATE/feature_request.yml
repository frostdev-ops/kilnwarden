name: Feature request
description: An idea for Kilnwarden.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task you want to get done on your server, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you picture it
      description: A page, a button, a setting, a webhook ... Sketches and screenshots welcome.
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Other tools that do this well, or how many people on your server would use it.
